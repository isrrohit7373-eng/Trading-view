<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>TradingView Mobile Pro Chart</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <!-- Top Compact HUD -->
    <header id="topHud" class="top-hud">
      <div class="hud-row hud-title-row">
        <div class="symbol-badge" id="headerSymbolBtn">
          <span class="coin-icon" id="coinIcon">₿</span>
          <span class="coin-name" id="coinName">Bitcoin / U.S. Dollar</span>
          <span class="live-dot-wrap" title="Live Binance WebSocket">
            <span class="live-dot" id="liveDot"></span>
            <span class="ws-wave">≈</span>
          </span>
        </div>
        <button class="icon-pill-btn" id="cleanChartTopBtn" title="Clean Chart (Hide HUD)">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>

      <div class="hud-row hud-ohlc-row" id="ohlcRow">
        <span class="ohlc-item">O <b id="valO">--</b></span>
        <span class="ohlc-item">H <b id="valH">--</b></span>
        <span class="ohlc-item">L <b id="valL">--</b></span>
        <span class="ohlc-item">C <b id="valC">--</b></span>
        <span class="ohlc-chg" id="valChg"></span>
      </div>

      <div class="hud-row hud-meta-row" id="hudMetaRow">
        <span class="vol-readout">Vol · <span id="volUnit">BTC</span> <b id="valVol">--</b></span>

        <button class="fx-pill" id="fxPopoverBtn" aria-expanded="false">
          <span class="fx-italic">fx</span>
          <span id="fxCount">8/9</span>
          <span class="fx-caret">▾</span>
        </button>

        <span class="bias-pill neutral" id="biasPill">● NEUTRAL</span>
      </div>

      <!-- Collapsible Live Indicator Readout Popover -->
      <div class="fx-popover hidden" id="fxPopover">
        <div class="fx-popover-head">
          <span>Active Indicators</span>
          <button class="text-link-btn" id="openMasterFromPopover">All Settings ⚙</button>
        </div>
        <div class="fx-popover-list" id="fxPopoverList"></div>
      </div>
    </header>

    <!-- Main Interactive Canvas Wrapper -->
    <main class="chart-stage" id="chartStage">
      <canvas id="chartCanvas"></canvas>

      <!-- Loading / Status Toast -->
      <div class="status-toast hidden" id="statusToast">Connecting to Binance…</div>

      <!-- Floating Watermark -->
      <div class="tv-watermark">TV</div>

      <!-- Jump to Latest Button -->
      <button class="float-btn jump-latest hidden" id="jumpLatestBtn" title="Jump to Latest Candle">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2">
          <polyline points="13 17 18 12 13 7"></polyline>
          <polyline points="6 17 11 12 6 7"></polyline>
        </svg>
      </button>

      <!-- Auto-Fit Y-Axis Button -->
      <button class="auto-badge active" id="autoFitBadge" title="Auto-Fit Price Scale">A</button>

      <!-- Restore HUD Floating Button (visible only in Clean Chart Mode) -->
      <button class="restore-hud-btn hidden" id="restoreHudBtn" title="Show HUD">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <span>HUD</span>
      </button>
    </main>

    <!-- Bottom TradingView Pill Toolbar -->
    <nav class="bottom-bar" id="bottomBar">
      <button class="symbol-pill" id="symbolSheetBtn">
        <span class="pill-coin" id="pillCoinIcon">₿</span>
        <span class="pill-sym" id="pillSymText">BTCUSDT</span>
        <span class="pill-tf" id="pillTfText">1m</span>
      </button>

      <div class="tool-pill-group">
        <button class="tool-btn" id="crosshairBtn" title="Toggle Crosshair">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="2" x2="12" y2="22"></line>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>

        <button class="tool-btn has-dot" id="indicatorsBtn" title="All Indicators & Settings">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 17 9 11 13 15 21 7"></polyline>
            <polyline points="16 7 21 7 21 12"></polyline>
          </svg>
          <span class="active-dot" id="indActiveDot"></span>
        </button>

        <button class="tool-btn" id="cleanChartBtn" title="Clean Chart (Hide HUD)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>

        <button class="tool-btn active" id="autoBtn" title="Toggle Auto-Fit Y">
          <span class="btn-letter">A</span>
        </button>

        <button class="tool-btn" id="resetViewBtn" title="Reset Zoom & View">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path>
            <polyline points="3 3 3 8 8 8"></polyline>
          </svg>
        </button>
      </div>
    </nav>

    <!-- Backdrop -->
    <div class="sheet-backdrop hidden" id="sheetBackdrop"></div>

    <!-- Symbol & Timeframe Bottom Sheet -->
    <section class="bottom-sheet hidden" id="symbolSheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <h3>Symbol & Timeframe</h3>
        <button class="sheet-close" data-close="symbolSheet">✕</button>
      </div>
      <div class="sheet-body">
        <div class="sheet-label">Trading Pair (Live Binance)</div>
        <div class="chip-grid" id="symbolChipGrid"></div>

        <div class="sheet-label" style="margin-top:16px;">Timeframe</div>
        <div class="chip-grid tf-grid" id="tfChipGrid"></div>
      </div>
    </section>

    <!-- Master All-Indicators Settings Bottom Sheet -->
    <section class="bottom-sheet tall hidden" id="settingsSheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <h3>Indicators & Settings</h3>
        <button class="sheet-close" data-close="settingsSheet">✕</button>
      </div>

      <!-- Horizontally Scrollable Tab Bar -->
      <div class="tabs-scroller" id="settingsTabs"></div>

      <!-- Tab Content Area -->
      <div class="sheet-body settings-body" id="settingsBody"></div>
    </section>
  </div>

  <!-- Modular Architecture (Works on both file:// and HTTP servers) -->
  <script src="js/config.js"></script>
  <script src="js/dataEngine.js"></script>
  <script src="js/indicators.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/touchController.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
